# docker-compose.yml — memory-mcp: basic-memory MCP server + basic-memory-viewer UI
#
# Single container, one shared persistent store on the "basic-memory-data"
# named volume (mounted at /data). Two TCP listeners:
#   8765  basic-memory MCP server (streamable-http, path /mcp)
#   8200  basic-memory-viewer web UI (uvicorn, FastAPI)
#
# Tunables come from .env (copy .env.example); defaults apply without it.
# No secrets live in this file.

services:
  memory-mcp:
    build:
      context: .
    image: memory-mcp:latest
    container_name: memory-mcp
    restart: unless-stopped

    # Host bindings; free on dragonball04 as of 2026-09-23.
    ports:
      - "${HOST_MCP_PORT:-8765}:8765"
      - "${HOST_VIEWER_PORT:-8200}:8200"

    # Persistent store: notes (markdown), SQLite index, and git history.
    volumes:
      - basic-memory-data:/data

    # Runtime environment (see Dockerfile for the rest). Values here mirror the
    # defaults documented in the image's README/docs — all official env var names.
    environment:
      HOME: /data
      BASIC_MEMORY_CONFIG_DIR: /data/.basic-memory
      BASIC_MEMORY_AUTO_UPDATE: "false"
      BASIC_MEMORY_NO_PROMOS: "1"
      NOTES_DIR: /data/basic-memory
      MCP_URL: http://localhost:8765/mcp
      MCP_TRANSPORT: http
      BM_PROJECT: main
      APP_TITLE: Basic Memory
      # APP_USER: bulma   # optional: label shown in the viewer sidebar

volumes:
  basic-memory-data:
    name: basic-memory-data